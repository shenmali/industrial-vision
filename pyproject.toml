[project]
name = "industrial-vision"
version = "0.1.0"
description = "CV + PLC defect detection showcase"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CompVi Author" }]
dependencies = [
  "albumentations>=1.4.0",
  "opencv-python-headless>=4.9.0",
  "numpy>=1.26.0",
  "pillow>=10.3.0",
  "pydantic>=2.7.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pymodbus>=3.7.0",
  "prometheus-client>=0.20.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "dvc>=3.50.0",
  "tqdm>=4.66.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
]

[project.scripts]
industrial-vision = "industrial_vision.cli:main"

[project.optional-dependencies]
plc-opcua = ["asyncua>=1.0.0"]
plc-snap7 = ["python-snap7>=2.0.0"]

[dependency-groups]
pytorch = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM"]
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"notebooks/**/*.py" = ["E402", "B018"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/industrial_vision"]
disable_error_code = ["no-any-return", "no-untyped-call", "type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
  "integration: end-to-end tests",
  "perf: performance benchmarks",
  "slow: >10s runtime",
]

[tool.coverage.run]
branch = true
source = ["src/industrial_vision"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
fail_under = 70
