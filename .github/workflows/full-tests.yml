name: Full Tests (with PyTorch)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  pytorch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync
      - name: Install pytorch group
        run: uv sync --group pytorch
      - name: Run all tests
        run: uv run pytest -v
