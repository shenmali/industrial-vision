name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm scikit-learn
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-mock pytest-asyncio omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm httpx scikit-learn
      - run: PYTHONPATH=src python -m pytest tests/unit/test_config.py tests/unit/test_decision.py tests/unit/test_data_registry.py tests/unit/test_splitter.py tests/unit/test_metrics.py tests/unit/test_logging_config.py tests/unit/test_configs.py tests/unit/test_plc_base.py tests/unit/test_plc_factory.py tests/unit/test_plc_stubs.py tests/unit/test_capture_file.py tests/unit/test_capture_video.py tests/unit/test_cli.py tests/unit/test_api.py -v

  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-mock pytest-asyncio omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm httpx scikit-learn torch torchvision
      - run: PYTHONPATH=src python -m pytest tests/unit/test_patchcore.py tests/unit/test_efficientad.py tests/unit/test_anomaly_ensemble.py tests/unit/test_classifier.py tests/unit/test_gradcam.py tests/unit/test_pipeline.py -v
