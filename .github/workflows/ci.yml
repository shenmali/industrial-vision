name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Run unit tests (no pytorch)
        run: |
          uv run pytest \
            tests/unit/test_config.py \
            tests/unit/test_decision.py \
            tests/unit/test_data_registry.py \
            tests/unit/test_splitter.py \
            tests/unit/test_metrics.py \
            tests/unit/test_logging_config.py \
            tests/unit/test_configs.py \
            tests/unit/test_plc_base.py \
            tests/unit/test_plc_factory.py \
            tests/unit/test_pymodbus_client.py \
            tests/unit/test_plc_stubs.py \
            tests/unit/test_capture_file.py \
            tests/unit/test_capture_video.py \
            tests/unit/test_cli.py \
            tests/unit/test_api.py \
            tests/unit/test_datasets.py \
            tests/unit/test_augment.py \
            -v
      - name: Build Docker image
        run: docker build -t industrial-vision:ci .
