name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install \
          pytest \
          omegaconf \
          pydantic \
          prometheus-client \
          fastapi \
          pymodbus \
          opencv-python-headless \
          albumentations \
          httpx
      - run: python -m pytest \
          tests/unit/test_config.py \
          tests/unit/test_decision.py \
          tests/unit/test_data_registry.py \
          tests/unit/test_splitter.py \
          tests/unit/test_metrics.py \
          tests/unit/test_logging_config.py \
          tests/unit/test_configs.py \
          tests/unit/test_plc_base.py \
          tests/unit/test_plc_factory.py \
          tests/unit/test_pymodbus_client.py \
          tests/unit/test_plc_stubs.py \
          tests/unit/test_capture_file.py \
          tests/unit/test_capture_video.py \
          tests/unit/test_cli.py \
          tests/unit/test_api.py \
          tests/unit/test_datasets.py \
          tests/unit/test_augment.py \
          -v -p no:cacheprovider
