name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm scikit-learn
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-mock pytest-asyncio omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm httpx scikit-learn
      - run: PYTHONPATH=src python -m pytest tests/unit/ -v --ignore=tests/unit/test_patchcore.py --ignore=tests/unit/test_efficientad.py --ignore=tests/unit/test_anomaly_ensemble.py --ignore=tests/unit/test_classifier.py --ignore=tests/unit/test_gradcam.py --ignore=tests/unit/test_pipeline.py
