name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest omegaconf pydantic prometheus-client fastapi pymodbus opencv-python-headless albumentations numpy pillow tqdm httpx
      - run: python -m pytest tests/unit/ -v -p no:cacheprovider --ignore=tests/unit/test_patchcore.py --ignore=tests/unit/test_efficientad.py --ignore=tests/unit/test_anomaly_ensemble.py --ignore=tests/unit/test_classifier.py --ignore=tests/unit/test_gradcam.py --ignore=tests/unit/test_pipeline.py
